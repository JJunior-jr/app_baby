version: '3.8'

services:
  # Python FastAPI backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baby_john_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=baby_john_vps_jwt_super_secret_key_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    volumes:
      - ./backend:/app

  # Mobile Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baby_john_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
