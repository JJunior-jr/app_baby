version: '3.9'

# Development Environment with Hot Reload
# Usage: docker-compose up -d
# Access: http://localhost:8000

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: baby_john_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-baby_john_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baby_john_password}
      POSTGRES_DB: ${DB_NAME:-baby_john_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - baby_john_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-baby_john_user} -d ${DB_NAME:-baby_john_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"

  # FastAPI Application
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baby_john_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://baby_john_user:baby_john_password@postgres:5432/baby_john_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - baby_john_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baby_john_frontend
    ports:
      - "3000:3000"
    networks:
      - baby_john_network
    depends_on:
      - api
    restart: unless-stopped

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: baby_john_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - baby_john_network
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  baby_john_network:
    driver: bridge
